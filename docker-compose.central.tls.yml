services:
  caddy:
    image: caddy:2.11.4-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      central:
        condition: service_started
    env_file:
      - ./central/proxy.env
    ports:
      # Compose-level fail closed: this form makes `docker compose config` exit
      # non-zero when the variable is missing or empty. A blank value would
      # interpolate to ":443:443" and bind every host interface.
      - "${WEFLOW_CENTRAL_HTTPS_BIND:?set WEFLOW_CENTRAL_HTTPS_BIND in central/proxy.env to the exact host IPv4 address for the HTTPS listener}:443:443"
    volumes:
      - ./central/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - weflow-internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
