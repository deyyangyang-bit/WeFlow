services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weflow
      POSTGRES_USER: weflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - weflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weflow -d weflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [weflow-internal]

  central:
    build:
      context: .
      dockerfile: central/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: central/.env
    environment:
      WEFLOW_CENTRAL_DATABASE_URL: postgres://weflow@postgres:5432/weflow
      WEFLOW_CENTRAL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      WEFLOW_CENTRAL_TLS_TERMINATED: "true"
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:8787:8787"
    networks: [weflow-internal]

volumes:
  weflow-postgres:

networks:
  weflow-internal:
    driver: bridge

secrets:
  postgres_password:
    file: ./central/secrets/postgres_password
